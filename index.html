<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Marche Bou Makk: a global multi-vendor marketplace with local delivery" />
    <meta name="theme-color" content="#0b7a4b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Marche Bou Makk</title>
    <script>
      (function () {
        var lang = localStorage.getItem('mbm.locale');
        if (lang) document.documentElement.lang = lang;
        var theme = localStorage.getItem('mbm.theme');
        var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
